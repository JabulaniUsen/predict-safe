<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — PredictSafe</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #1e40af;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgb(15 23 42 / 8%);
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 999px;
        background: #eff6ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: #475569;
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1e3a8a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        PredictSafe needs a connection to show live predictions and scores. Check your network and
        try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
